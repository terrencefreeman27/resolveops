[pytest]
testpaths = tests
addopts = -p no:cacheprovider -m "not live and not github_live"
markers =
    live: calls the real Anthropic API; run explicitly with `pytest -m live` (skipped unless ANTHROPIC_API_KEY is set)
    github_live: creates one real issue in the dedicated GitHub test repo; run explicitly with `pytest -m github_live` (skipped unless GITHUB_TOKEN and GITHUB_ISSUES_REPO are set)
