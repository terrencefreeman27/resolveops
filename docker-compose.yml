name: resolveops
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolveops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveops}
      POSTGRES_DB: ${POSTGRES_DB:-resolveops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    # ANTHROPIC_API_KEY and the optional LIVE_* settings come only from ./.env (git-ignored), never from the
    # host shell, so a key exported for other tools is not picked up. Only this service receives them.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resolveops}:${POSTGRES_PASSWORD:-resolveops}@db:5432/${POSTGRES_DB:-resolveops}
      AI_MODE: ${AI_MODE:-demo}
      SEED_ON_START: "true"
      SEED_REVIEWER_EMAIL: ${SEED_REVIEWER_EMAIL:-reviewer@northstar.example}
      SEED_REVIEWER_PASSWORD: ${SEED_REVIEWER_PASSWORD:-northstar-demo}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # localhost only: not reachable from other devices on the network
    # Evaluation suites (eval/) run inside this container; results are written back to the host and
    # the dashboard reads the latest ones. Read-write so `python -m eval.run_*` can save results.
    volumes:
      - ./eval:/srv/eval
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"  # localhost only

volumes:
  pgdata:
